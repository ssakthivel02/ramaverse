name: RamaVerse clean-room CI

on:
  push:
    branches: [website-nextgen-cleanroom-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate route and foundation contracts
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify clean-room tracked source isolation
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '^(web|mobile|android|node_modules|dist|coverage|\.vite)/'; then
            echo 'Forbidden legacy/generated root is tracked in the clean-room branch.'
            exit 1
          fi
          if grep -R -n -E 'KirthiVerse|DivyaNexus|OmSaravanaBhava|SakthiAI|SaravanAI' src public; then
            echo 'Cross-project source reference detected.'
            exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(\.env|\.env\..+|id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.pfx)$'; then
            echo 'Secret-like tracked path detected.'
            exit 1
          fi
          echo 'CLEANROOM_SOURCE_ISOLATION_PASS'
