name: RamaVerse temporary lock diagnostic

on:
  push:
    branches:
      - website-nextgen-reconciliation-prep-v1

permissions:
  contents: read

jobs:
  lock-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print lock identity
        run: sha256sum package-lock.json && wc -c package-lock.json
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: ramaverse-lock-diagnostic-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
