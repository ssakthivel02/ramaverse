name: RamaVerse temporary lock diagnostic

on:
  push:
    branches:
      - website-nextgen-reconciliation-prep-v1

permissions:
  contents: read

jobs:
  lock-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recreate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print lock identity and PostCSS resolution
        run: |
          sha256sum package-lock.json
          wc -c package-lock.json
          node -e 'const lock=require("./package-lock.json"); const p=lock.packages["node_modules/postcss"]; console.log(JSON.stringify({version:p.version,resolved:p.resolved,integrity:p.integrity,dependencies:p.dependencies},null,2))'
      - name: Install regenerated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit regenerated production dependency surface
        run: npm audit --omit=dev --audit-level=high
      - name: Show PostCSS dependency path
        run: npm ls postcss --all
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: ramaverse-lock-diagnostic-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
