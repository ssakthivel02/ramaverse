name: RamaVerse temporary lock restoration

on:
  push:
    branches:
      - website-nextgen-quarantine-extraction-gate-v1

permissions:
  contents: write
  actions: read

jobs:
  restore-green-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact green lock artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9885396050/zip" \
            -o /tmp/green-lock-artifact.zip
          unzip -p /tmp/green-lock-artifact.zip package-lock.json > package-lock.json
          echo "c61a40a96b6948c47f3a7f36399644fe3870730293e7dc571f7583a96a3b7bfb  package-lock.json" | sha256sum -c -
          test "$(wc -c < package-lock.json)" -eq 106804
          test "$(node -e 'const l=require("./package-lock.json"); process.stdout.write(String(Object.keys(l.packages||{}).length))')" -eq 211
          node scripts/check-lock.mjs
      - name: Commit only the approved package lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Approved package-lock.json already tracked; no commit needed."
            exit 0
          fi
          git commit -m "Track exact green dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
