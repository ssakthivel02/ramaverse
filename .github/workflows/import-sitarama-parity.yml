name: Import SitaRama donor parity

on:
  push:
    branches: [integration/sitarama-parity]
    paths: [.github/workflows/import-sitarama-parity.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/sitarama-parity
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ssakthivel02/sitarama-legacy
          ref: 72dcb751fb3ef74a6c4cd4d82dbaa39b457b8fe3
          path: .donor
          persist-credentials: false
      - name: Import validated Ramayana feature/content parity
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README.md' \
            --exclude='.donor/' \
            .donor/ ./
          rm -rf .donor
          printf '%s\n' '72dcb751fb3ef74a6c4cd4d82dbaa39b457b8fe3' > SITARAMA_DONOR_COMMIT.txt
      - name: Commit parity snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import validated SitaRama feature and content parity snapshot'
          git push origin HEAD:integration/sitarama-parity
