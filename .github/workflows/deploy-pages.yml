name: Deploy RamaVerse Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ramaverse-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate production static surface
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s 404.html
          test -s manifest.json
          test -s js/app.js
          test -s css/style.css
          test -s SITARAMA_DONOR_COMMIT.txt
          test "$(tr -d '\r\n ' < SITARAMA_DONOR_COMMIT.txt)" = "72dcb751fb3ef74a6c4cd4d82dbaa39b457b8fe3"
          grep -q 'RamaVerse' index.html
          grep -q 'https://ramaverse.omsaravanabhava.org/' index.html
          ! grep -q 'https://sitarama.omsaravanabhava.org/' index.html
          ! test -e CNAME
          node --check js/app.js
      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'node_modules/'
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy RamaVerse
        id: deployment
        uses: actions/deploy-pages@v4
