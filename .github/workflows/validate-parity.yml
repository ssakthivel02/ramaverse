name: Validate RamaVerse parity

on:
  push:
    branches: [integration/sitarama-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate preserved Ramayana platform
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s 404.html
          test -s privacy.html
          test -s terms.html
          test -s sources.html
          test -s accessibility.html
          test -s manifest.json
          test -s SITARAMA_DONOR_COMMIT.txt
          test "$(tr -d '\r\n ' < SITARAMA_DONOR_COMMIT.txt)" = "72dcb751fb3ef74a6c4cd4d82dbaa39b457b8fe3"
          ! test -e CNAME
          grep -q 'RamaVerse' index.html
          grep -q 'https://ramaverse.omsaravanabhava.org/' index.html
          ! grep -q 'https://sitarama.omsaravanabhava.org/' index.html
          grep -q '"name":"RamaVerse"' manifest.json
          html_count=$(find . -maxdepth 2 -type f -name '*.html' | wc -l)
          test "$html_count" -ge 10
          echo "Validated RamaVerse HTML pages: $html_count"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -f js/app.js ]; then node --check js/app.js; fi
          if [ -f service-worker.js ]; then node --check service-worker.js; fi
          if [ -f sw.js ]; then node --check sw.js; fi
